<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16181f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>#コンパス ガチャ記録</title>
<style>
:root{
  --bg:#13151b;--card:#1e222c;--card2:#171a21;--muted:#9fa7b7;--text:#f4f6f8;
  --gold:#e7bd52;--silver:#d5dae2;--line:#343a48;--good:#8bd49c;--bad:#ff9999;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:980px;margin:auto;padding:16px 12px 100px}
h1{font-size:23px;margin:8px 0 14px}
h2,h3{margin:0 0 12px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;position:sticky;top:0;background:rgba(19,21,27,.94);padding:8px 0;backdrop-filter:blur(10px);z-index:10}
button{border:0;border-radius:11px;padding:11px;background:#303646;color:white;font-weight:700}
.tabs button{padding:10px 3px;font-size:12px}
.tabs button.active{background:var(--gold);color:#111}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:11px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.stat{background:var(--card2);border-radius:13px;padding:13px}
.big{font-size:24px;font-weight:800}
.muted{color:var(--muted);font-size:12px}
.gold{color:var(--gold)} .silver{color:var(--silver)}
.good{color:var(--good)} .bad{color:var(--bad)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#14171e;color:white;font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.primary{background:var(--gold);color:#111}
.danger{background:#5a2a2a}
.secondary{background:#3a4152}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:7px}
.quick button{padding:10px 4px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:9px 5px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
.hidden{display:none}
.entry{padding:12px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry-title{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.actions{display:flex;gap:8px;margin-top:9px}
.actions button{padding:8px 10px;font-size:12px}
.note{font-size:12px;color:var(--muted);line-height:1.55}
.progress{height:12px;background:#101219;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progress>div{height:100%;background:linear-gradient(90deg,#b28a32,#f0cf70)}
.kpi{display:flex;justify-content:space-between;gap:10px;align-items:end;margin:5px 0 7px}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#2a3040;font-size:11px}
.chartrow{display:grid;grid-template-columns:80px 1fr 55px;gap:8px;align-items:center;margin:9px 0}
.bar{height:12px;background:#101219;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar>div{height:100%;background:#d6b45f}
.bar.sr>div{background:#d9dde5}
.bar.cur>div{background:#ad8b3a}
.detailCard{background:#171a21;border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}
.version{font-size:11px;color:#6f7787;text-align:center;margin-top:18px}
@media(min-width:720px){.grid{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<h1>#コンパス ガチャ記録</h1>

<div class="tabs">
<button data-tab="home" class="active">集計</button>
<button data-tab="add">追加</button>
<button data-tab="collab">コラボ</button>
<button data-tab="analysis">分析</button>
<button data-tab="history">履歴</button>
<button data-tab="settings">設定</button>
</div>

<section id="home">
  <div class="grid" id="stats"></div>
  <div class="card">
    <h3>公表確率との比較</h3>
    <div id="compare"></div>
  </div>
</section>

<section id="add" class="hidden">
  <div class="card">
    <h3>結果を追加</h3>
    <label>日付</label><input id="date" type="date">
    <label>コラボ名</label>
    <input id="collabName" list="collabNames" placeholder="例：陰の実力者になりたくて">
    <datalist id="collabNames"></datalist>

    <label>連数</label><input id="pulls" type="number" min="1" value="60">
    <div class="quick">
      <button type="button" onclick="setPulls(60)">60連</button>
      <button type="button" onclick="setPulls(120)">120連</button>
      <button type="button" onclick="setPulls(180)">180連</button>
      <button type="button" onclick="setPulls(300)">300連</button>
    </div>

    <div class="row">
      <div><label>UR 常設</label><input id="urNormal" type="number" min="0" value="0"></div>
      <div><label>UR コラボ</label><input id="urCollab" type="number" min="0" value="0"></div>
    </div>
    <div class="row">
      <div><label>SR 常設</label><input id="srNormal" type="number" min="0" value="0"></div>
      <div><label>SR コラボ</label><input id="srCollab" type="number" min="0" value="0"></div>
    </div>

    <label>かんたん入力（任意）</label>
    <input id="quickInput" placeholder="例：SR 11:18 / UR 4:0">
    <button class="secondary" style="width:100%;margin-top:7px" onclick="parseQuick()">反映</button>

    <label>メモ</label><textarea id="memo" rows="2" placeholder="任意"></textarea>
    <button class="primary" style="width:100%;margin-top:14px" onclick="addEntry()">保存</button>
  </div>
</section>

<section id="collab" class="hidden">
  <div class="card">
    <h3>コラボ別詳細</h3>
    <div id="collabDetails"></div>
  </div>
</section>

<section id="analysis" class="hidden">
  <div class="card">
    <h3>排出率グラフ</h3>
    <div id="rateCharts"></div>
  </div>
  <div class="card">
    <h3>800連交換まで</h3>
    <div id="ceilingCards"></div>
    <p class="note">交換進捗はコラボごとに800連を基準として計算しています。60連単位で引く場合は、必要回数を切り上げて表示します。</p>
  </div>
</section>

<section id="history" class="hidden">
  <div class="card"><div id="historyList"></div></div>
</section>

<section id="settings" class="hidden">
  <div class="card">
    <h3>設定・バックアップ</h3>
    <label>UR 公表確率（%）</label><input id="rateUR" type="number" step="0.01" value="2">
    <label>SR 公表確率（%）</label><input id="rateSR" type="number" step="0.01" value="18">
    <label>コラボUR 公表確率（%）</label><input id="rateCUR" type="number" step="0.01" value="1">
    <label>60連あたりBM</label><input id="bmPer60" type="number" value="5000">
    <button class="primary" style="width:100%;margin-top:14px" onclick="saveSettings()">設定を保存</button>
    <div class="actions">
      <button onclick="exportJSON()">JSONバックアップ</button>
      <button onclick="exportCSV()">CSV出力</button>
    </div>
    <label>JSONバックアップから復元</label>
    <input id="importFile" type="file" accept=".json" onchange="importJSON(event)">
    <p class="note">アップデートで記録データは消えません。データはこのiPhone内に保存されます。ただしSafariのサイトデータを削除すると巻き添えで消えるので、たまにバックアップ推奨です。人類は「あとでやる」を信用しすぎます。</p>
  </div>
</section>

<div class="version">v2.0</div>
</div>

<script>
const DEFAULT_ENTRIES = [
 {id:1,date:"2026-07-27",collab:"雀魂",pulls:60,urNormal:1,urCollab:0,srNormal:3,srCollab:5,memo:""},
 {id:2,date:"2026-07-28",collab:"雀魂",pulls:60,urNormal:1,urCollab:0,srNormal:2,srCollab:4,memo:""},
 {id:3,date:"2026-08-01",collab:"雀魂",pulls:60,urNormal:1,urCollab:0,srNormal:5,srCollab:7,memo:""},
 {id:4,date:"2026-08-01",collab:"雀魂",pulls:60,urNormal:0,urCollab:0,srNormal:9,srCollab:2,memo:""},
 {id:5,date:"2026-08-01",collab:"雀魂",pulls:60,urNormal:1,urCollab:1,srNormal:6,srCollab:4,memo:""},
 {id:6,date:"2026-08-28",collab:"陰の実力者になりたくて",pulls:60,urNormal:0,urCollab:2,srNormal:3,srCollab:3,memo:""},
 {id:7,date:"2026-08-28",collab:"陰の実力者になりたくて",pulls:60,urNormal:0,urCollab:0,srNormal:6,srCollab:4,memo:""},
 {id:8,date:"2026-09-01",collab:"陰の実力者になりたくて",pulls:180,urNormal:4,urCollab:0,srNormal:11,srCollab:18,memo:""}
];

let entries = JSON.parse(localStorage.getItem("cg_entries")||"null");
if(!entries){entries=DEFAULT_ENTRIES;localStorage.setItem("cg_entries",JSON.stringify(entries))}
let settings = JSON.parse(localStorage.getItem("cg_settings")||'{"ur":2,"sr":18,"cur":1,"bm":5000}');

const $=id=>document.getElementById(id);
$("rateUR").value=settings.ur;
$("rateSR").value=settings.sr;
$("rateCUR").value=settings.cur;
$("bmPer60").value=settings.bm;
$("date").value=new Date().toLocaleDateString("sv-SE");

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");
 document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));
 $(b.dataset.tab).classList.remove("hidden");
 render();
});

function totals(list=entries){
 let t={pulls:0,urNormal:0,urCollab:0,srNormal:0,srCollab:0};
 list.forEach(e=>Object.keys(t).forEach(k=>t[k]+=Number(e[k]||0)));
 t.ur=t.urNormal+t.urCollab;
 t.sr=t.srNormal+t.srCollab;
 t.r=t.pulls-t.ur-t.sr;
 return t;
}
const pct=(a,b)=>b?((a/b)*100).toFixed(2):"0.00";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function verdict(actual, expected){
 const d=actual-expected;
 if(Math.abs(d)<1) return `<span class="pill">ほぼ期待値</span>`;
 return d>0?`<span class="pill good">上振れ</span>`:`<span class="pill bad">下振れ</span>`;
}
function setPulls(n){$("pulls").value=n}

function parseQuick(){
 const s=$("quickInput").value.toUpperCase().replace(/：/g,":");
 const sr=s.match(/SR\s*(\d+)\s*:\s*(\d+)/);
 const ur=s.match(/UR\s*(\d+)\s*:\s*(\d+)/);
 if(sr){$("srNormal").value=sr[1];$("srCollab").value=sr[2]}
 if(ur){$("urNormal").value=ur[1];$("urCollab").value=ur[2]}
 if(!sr&&!ur) alert("例：SR 11:18 / UR 4:0 の形で入力してください");
}

function render(){
 const t=totals();
 const bm=Math.round(t.pulls/60*settings.bm);
 $("stats").innerHTML=`
  <div class="stat"><div class="muted">総連数</div><div class="big">${t.pulls}</div></div>
  <div class="stat"><div class="muted">UR</div><div class="big gold">${t.ur}</div><div class="muted">${pct(t.ur,t.pulls)}%</div></div>
  <div class="stat"><div class="muted">コラボUR</div><div class="big gold">${t.urCollab}</div><div class="muted">${pct(t.urCollab,t.pulls)}%</div></div>
  <div class="stat"><div class="muted">SR</div><div class="big silver">${t.sr}</div><div class="muted">${pct(t.sr,t.pulls)}%</div></div>
  <div class="stat"><div class="muted">R</div><div class="big">${t.r}</div><div class="muted">${pct(t.r,t.pulls)}%</div></div>
  <div class="stat"><div class="muted">消費BM</div><div class="big">${bm.toLocaleString()}</div></div>`;

 const rows=[
   ["UR",settings.ur,t.ur],["SR",settings.sr,t.sr],["コラボUR",settings.cur,t.urCollab]
 ].map(([n,r,a])=>{
   let ex=t.pulls*r/100,d=a-ex;
   return `<tr><td>${n}</td><td>${r}%</td><td>${ex.toFixed(1)}</td><td>${a}</td><td class="${d>=0?'good':'bad'}">${d>=0?'+':''}${d.toFixed(1)}</td><td>${verdict(a,ex)}</td></tr>`
 }).join("");
 $("compare").innerHTML=`<table><tr><th>種類</th><th>公表</th><th>期待</th><th>実績</th><th>差</th><th>判定</th></tr>${rows}</table>`;

 const groups={};
 entries.forEach(e=>(groups[e.collab]??=[]).push(e));
 const names=Object.keys(groups).sort((a,b)=>a.localeCompare(b,"ja"));
 $("collabNames").innerHTML=names.map(n=>`<option value="${esc(n)}"></option>`).join("");

 $("collabDetails").innerHTML=names.map(n=>{
   const x=totals(groups[n]);
   const urExp=x.pulls*settings.ur/100, curExp=x.pulls*settings.cur/100, srExp=x.pulls*settings.sr/100;
   return `<div class="detailCard">
     <div class="entry-title"><span>${esc(n)}</span><span>${x.pulls}連</span></div>
     <div class="note" style="margin-top:8px">
       UR ${x.ur}枚（常設${x.urNormal} / コラボ${x.urCollab}）・${pct(x.ur,x.pulls)}% ${verdict(x.ur,urExp)}<br>
       コラボUR ${x.urCollab}枚・${pct(x.urCollab,x.pulls)}% ${verdict(x.urCollab,curExp)}<br>
       SR ${x.sr}枚（常設${x.srNormal} / コラボ${x.srCollab}）・${pct(x.sr,x.pulls)}% ${verdict(x.sr,srExp)}
     </div>
   </div>`
 }).join("");

 const maxRate=Math.max(settings.sr,20);
 const bar=(name,actual,target,cls="")=>`
   <div class="chartrow">
    <div>${name}</div>
    <div class="bar ${cls}"><div style="width:${Math.min(100,actual/maxRate*100)}%"></div></div>
    <div>${actual.toFixed(2)}%</div>
   </div>
   <div class="note" style="margin:-5px 0 8px 88px">公表 ${target}%</div>`;
 $("rateCharts").innerHTML =
   bar("UR",t.pulls?t.ur/t.pulls*100:0,settings.ur) +
   bar("コラボUR",t.pulls?t.urCollab/t.pulls*100:0,settings.cur,"cur") +
   bar("SR",t.pulls?t.sr/t.pulls*100:0,settings.sr,"sr");

 $("ceilingCards").innerHTML=names.map(n=>{
   const x=totals(groups[n]);
   const progress=Math.min(100,x.pulls/800*100);
   const remain=Math.max(0,800-x.pulls);
   const batches=Math.ceil(remain/60);
   const needBM=batches*settings.bm;
   return `<div class="detailCard">
      <div class="kpi"><strong>${esc(n)}</strong><span>${Math.min(x.pulls,800)} / 800連</span></div>
      <div class="progress"><div style="width:${progress}%"></div></div>
      <div class="note" style="margin-top:8px">${
        remain===0 ? "800連到達済み" :
        `あと ${remain}連 ／ 60連単位ならあと ${batches}回（${(batches*60)}連）／ 約 ${needBM.toLocaleString()}BM`
      }</div>
   </div>`
 }).join("");

 $("historyList").innerHTML=[...entries].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).map(e=>`
 <div class="entry">
   <div class="entry-title"><span>${esc(e.collab)}</span><span>${esc(e.date)}</span></div>
   <div class="muted">${e.pulls}連 / UR 常設${e.urNormal}・コラボ${e.urCollab} / SR 常設${e.srNormal}・コラボ${e.srCollab}</div>
   ${e.memo?`<div class="note">${esc(e.memo)}</div>`:""}
   <div class="actions"><button class="danger" onclick="deleteEntry(${e.id})">削除</button></div>
 </div>`).join("");
}

function addEntry(){
 const e={
   id:Date.now(),date:$("date").value,collab:$("collabName").value.trim(),
   pulls:+$("pulls").value,urNormal:+$("urNormal").value,urCollab:+$("urCollab").value,
   srNormal:+$("srNormal").value,srCollab:+$("srCollab").value,memo:$("memo").value.trim()
 };
 if(!e.date||!e.collab||e.pulls<=0){alert("日付・コラボ名・連数を入力してください");return}
 if(e.urNormal+e.urCollab+e.srNormal+e.srCollab>e.pulls){alert("UR+SRが連数を超えています");return}
 entries.push(e);
 localStorage.setItem("cg_entries",JSON.stringify(entries));
 $("collabName").value="";$("memo").value="";$("quickInput").value="";
 ["urNormal","urCollab","srNormal","srCollab"].forEach(id=>$(id).value=0);
 $("pulls").value=60;
 alert("保存しました");
 render();
}
function deleteEntry(id){
 if(confirm("この記録を削除しますか？")){
   entries=entries.filter(e=>e.id!==id);
   localStorage.setItem("cg_entries",JSON.stringify(entries));
   render();
 }
}
function saveSettings(){
 settings={ur:+$("rateUR").value,sr:+$("rateSR").value,cur:+$("rateCUR").value,bm:+$("bmPer60").value};
 localStorage.setItem("cg_settings",JSON.stringify(settings));
 render();alert("保存しました");
}
function dl(name,text,type){
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([text],{type}));
 a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportJSON(){
 dl("compass-gacha-backup.json",JSON.stringify({entries,settings},null,2),"application/json");
}
function exportCSV(){
 const head="date,collab,pulls,ur_normal,ur_collab,sr_normal,sr_collab,memo\n";
 const body=entries.map(e=>[e.date,e.collab,e.pulls,e.urNormal,e.urCollab,e.srNormal,e.srCollab,e.memo]
 .map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");
 dl("compass-gacha.csv","\ufeff"+head+body,"text/csv");
}
function importJSON(ev){
 const f=ev.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
   try{
     const x=JSON.parse(r.result);
     entries=x.entries||[];
     settings=x.settings||settings;
     localStorage.setItem("cg_entries",JSON.stringify(entries));
     localStorage.setItem("cg_settings",JSON.stringify(settings));
     location.reload();
   }catch{alert("読み込みに失敗しました")}
 };
 r.readAsText(f);
}
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
